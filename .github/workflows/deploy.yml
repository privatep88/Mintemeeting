name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build production bundle with Vite
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || './' }}
        run: npm run build

      - name: Verify compiled dist output (No raw TSX in dist)
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          if grep -q "main.tsx" dist/index.html; then
            echo "Error: dist/index.html still references raw main.tsx!"
            exit 1
          fi

      - name: Publish dist to gh-pages branch (Branch Deployment Fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
        continue-on-error: true

      - name: Upload dist artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

